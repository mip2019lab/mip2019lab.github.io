<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>22/7 随精度增加的变化曲线</title>
    <!-- 引入 ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5f7fa;
            font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif;
            flex-direction: column;
            padding: 20px;
        }
        .chart-container {
            width: 900px;
            max-width: 98vw;
            height: 550px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            padding: 20px 20px 10px 20px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .chart-container:hover {
            box-shadow: 0 12px 40px rgba(0,0,0,0.18);
        }
        #chart {
            width: 100%;
            height: 100%;
        }
        .info-panel {
            width: 900px;
            max-width: 98vw;
            background: white;
            border-radius: 12px;
            padding: 16px 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #333;
        }
        .info-item .label {
            color: #888;
            font-weight: 400;
        }
        .info-item .value {
            font-weight: 600;
            color: #2E86AB;
            font-family: 'Courier New', monospace;
            font-size: 15px;
        }
        .info-item .value.highlight {
            color: #E74C3C;
            font-size: 18px;
        }
        .badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge.pi {
            background: #2E86AB20;
            color: #2E86AB;
        }
        .badge.approx {
            background: #E74C3C20;
            color: #E74C3C;
        }
        @media (max-width: 600px) {
            .chart-container {
                height: 400px;
                padding: 12px;
            }
            .info-panel {
                padding: 12px 16px;
                flex-direction: column;
                align-items: stretch;
            }
            .info-item {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="chart-container">
        <div id="chart"></div>
    </div>
    <div class="info-panel" id="infoPanel">
        <div class="info-item">
            <span class="label">📐 当前精度：</span>
            <span class="value" id="currentPrecision">--</span>
        </div>
        <div class="info-item">
            <span class="label">🔵 22/7 近似值：</span>
            <span class="value highlight" id="currentApprox">--</span>
        </div>
        <div class="info-item">
            <span class="label">🟠 π 真实值：</span>
            <span class="value" id="currentPi" style="color:#E67E22;">--</span>
        </div>
        <div class="info-item">
            <span class="label">📊 误差：</span>
            <span class="value" id="currentError" style="color:#27AE60;">--</span>
        </div>
    </div>

    <script>
        (function() {
            const chartDom = document.getElementById('chart');
            if (!chartDom) return;

            const myChart = echarts.init(chartDom, 'light');

            // ============================================================
            // 1. 生成数据：计算 22/7 在不同精度下的值
            //    精度从 1 位小数到 20 位小数
            // ============================================================
            const PI = Math.PI;                     // π 真实值 ≈ 3.141592653589793
            const EXACT_22_7 = 22 / 7;              // 22/7 的精确值 ≈ 3.142857142857143

            const precisionLevels = [];
            const approxValues = [];
            const errorValues = [];

            // 从 0 位小数到 20 位小数
            for (let decimals = 0; decimals <= 20; decimals++) {
                // 计算 22/7 并截断到指定位数（不四舍五入，直接截断）
                const factor = Math.pow(10, decimals);
                const truncated = Math.floor(EXACT_22_7 * factor) / factor;
                
                // 计算与 π 的绝对误差
                const error = Math.abs(truncated - PI);
                
                precisionLevels.push(decimals);
                approxValues.push(truncated);
                errorValues.push(error);
            }

            // ============================================================
            // 2. ECharts 配置
            // ============================================================
            const option = {
                // 标题
                title: {
                    text: '22/7 随小数点精度增加的变化曲线',
                    subtext: '展示 22/7 在不同精度下与 π 的逼近程度',
                    left: 'center',
                    top: 0,
                    textStyle: {
                        fontSize: 18,
                        fontWeight: 600,
                        color: '#1a2a3a'
                    },
                    subtextStyle: {
                        fontSize: 13,
                        color: '#888'
                    }
                },

                // 提示框
                tooltip: {
                    trigger: 'axis',
                    formatter: function(params) {
                        const p1 = params[0]; // 22/7 近似值
                        const p2 = params[1]; // 误差
                        const decimals = p1.name;
                        const approx = p1.value;
                        const error = p2 ? p2.value : 0;
                        return `
                            <strong>精度：${decimals} 位小数</strong><br/>
                            <span style="color:#2E86AB;">22/7 ≈ ${approx.toFixed(decimals)}</span><br/>
                            <span style="color:#E67E22;">π ≈ ${PI.toFixed(15)}</span><br/>
                            <span style="color:#27AE60;">误差：${error.toExponential(4)}</span>
                        `;
                    },
                    backgroundColor: 'rgba(255,255,255,0.95)',
                    borderColor: '#e0e0e0',
                    borderWidth: 1,
                    textStyle: { fontSize: 13 }
                },

                // 图例
                legend: {
                    data: ['22/7 近似值', '误差 (右轴)'],
                    top: 50,
                    left: 'center',
                    icon: 'roundRect',
                    itemWidth: 20,
                    itemHeight: 4,
                    textStyle: { fontSize: 13 }
                },

                // 网格
                grid: [
                    {
                        left: '6%',
                        right: '10%',
                        bottom: '14%',
                        top: '22%',
                        containLabel: true
                    }
                ],

                // X轴（精度）
                xAxis: {
                    type: 'category',
                    data: precisionLevels.map(d => d + '位'),
                    name: '小数位数',
                    nameLocation: 'center',
                    nameGap: 35,
                    nameTextStyle: {
                        fontSize: 13,
                        fontWeight: 600,
                        color: '#333'
                    },
                    axisLine: { lineStyle: { color: '#ccc' } },
                    axisTick: { alignWithLabel: true },
                    axisLabel: {
                        fontSize: 11,
                        color: '#555',
                        interval: 2  // 每2个显示一个，避免拥挤
                    },
                    boundaryGap: false
                },

                // Y轴（值）
                yAxis: [
                    {
                        type: 'value',
                        name: '22/7 近似值',
                        nameLocation: 'center',
                        nameGap: 50,
                        nameTextStyle: {
                            fontSize: 13,
                            fontWeight: 600,
                            color: '#2E86AB'
                        },
                        min: 3.14,
                        max: 3.16,
                        splitLine: {
                            lineStyle: {
                                color: '#e8e8e8',
                                type: 'dashed'
                            }
                        },
                        axisLabel: {
                            fontSize: 11,
                            color: '#555',
                            formatter: function(value) {
                                return value.toFixed(4);
                            }
                        },
                        axisLine: { show: true, lineStyle: { color: '#2E86AB' } }
                    },
                    {
                        type: 'value',
                        name: '误差',
                        nameLocation: 'center',
                        nameGap: 45,
                        nameTextStyle: {
                            fontSize: 13,
                            fontWeight: 600,
                            color: '#27AE60'
                        },
                        min: 0,
                        max: 0.005,
                        splitLine: { show: false },
                        axisLabel: {
                            fontSize: 11,
                            color: '#27AE60',
                            formatter: function(value) {
                                return value.toExponential(1);
                            }
                        },
                        axisLine: { show: true, lineStyle: { color: '#27AE60' } }
                    }
                ],

                // 系列数据
                series: [
                    // ---- 22/7 近似值（折线） ----
                    {
                        name: '22/7 近似值',
                        type: 'line',
                        data: approxValues,
                        smooth: true,
                        symbol: 'circle',
                        symbolSize: 6,
                        lineStyle: {
                            color: '#2E86AB',
                            width: 2.5
                        },
                        itemStyle: {
                            color: '#2E86AB',
                            borderColor: '#fff',
                            borderWidth: 1.5
                        },
                        areaStyle: {
                            color: {
                                type: 'linear',
                                x: 0,
                                y: 0,
                                x2: 0,
                                y2: 1,
                                colorStops: [
                                    { offset: 0, color: 'rgba(46,134,171,0.25)' },
                                    { offset: 1, color: 'rgba(46,134,171,0.02)' }
                                ]
                            }
                        },
                        label: {
                            show: true,
                            position: 'top',
                            formatter: function(params) {
                                const d = precisionLevels[params.dataIndex];
                                if (d % 3 === 0 || d === 20) {
                                    return params.value.toFixed(d);
                                }
                                return '';
                            },
                            fontSize: 9,
                            color: '#2E86AB',
                            distance: 4,
                            rotate: 30
                        },
                        // 标记 π 的真实值参考线（用markLine）
                        markLine: {
                            silent: true,
                            symbol: 'none',
                            lineStyle: {
                                color: '#E67E22',
                                width: 2,
                                type: 'dashed'
                            },
                            label: {
                                formatter: 'π ≈ 3.141592653589793',
                                color: '#E67E22',
                                fontSize: 11,
                                fontWeight: 600,
                                position: 'insideEndTop'
                            },
                            data: [
                                { yAxis: PI }
                            ]
                        }
                    },
                    // ---- 误差（柱状图/折线，右轴） ----
                    {
                        name: '误差 (右轴)',
                        type: 'line',
                        yAxisIndex: 1,
                        data: errorValues,
                        smooth: true,
                        symbol: 'diamond',
                        symbolSize: 7,
                        lineStyle: {
                            color: '#27AE60',
                            width: 2
                        },
                        itemStyle: {
                            color: '#27AE60',
                            borderColor: '#fff',
                            borderWidth: 1.5
                        },
                        areaStyle: {
                            color: {
                                type: 'linear',
                                x: 0,
                                y: 0,
                                x2: 0,
                                y2: 1,
                                colorStops: [
                                    { offset: 0, color: 'rgba(39,174,96,0.25)' },
                                    { offset: 1, color: 'rgba(39,174,96,0.02)' }
                                ]
                            }
                        },
                        label: {
                            show: true,
                            position: 'bottom',
                            formatter: function(params) {
                                const d = precisionLevels[params.dataIndex];
                                if (d % 5 === 0 || d === 20) {
                                    return params.value.toExponential(2);
                                }
                                return '';
                            },
                            fontSize: 9,
                            color: '#27AE60',
                            distance: 4
                        }
                    }
                ],

                // 数据缩放
                dataZoom: [
                    {
                        type: 'inside',
                        start: 0,
                        end: 100,
                        minSpan: 30
                    },
                    {
                        type: 'slider',
                        start: 0,
                        end: 100,
                        height: 20,
                        bottom: 5,
                        borderColor: '#ddd',
                        backgroundColor: 'rgba(47,69,84,0.05)',
                        fillerColor: 'rgba(46,134,171,0.15)',
                        handleStyle: {
                            color: '#2E86AB'
                        }
                    }
                ],

                // 工具栏
                toolbox: {
                    feature: {
                        saveAsImage: {
                            title: '保存为图片',
                            pixelRatio: 2,
                            backgroundColor: '#ffffff'
                        },
                        dataView: {
                            title: '查看数据',
                            lang: ['数据视图', '关闭', '刷新']
                        },
                        restore: {
                            title: '重置'
                        }
                    },
                    right: 20,
                    top: 10
                }
            };

            // ============================================================
            // 3. 渲染图表
            // ============================================================
            myChart.setOption(option);

            // ============================================================
            // 4. 更新信息面板（鼠标移动时更新）
            // ============================================================
            const precisionEl = document.getElementById('currentPrecision');
            const approxEl = document.getElementById('currentApprox');
            const piEl = document.getElementById('currentPi');
            const errorEl = document.getElementById('currentError');

            // 默认显示第 10 位小数的数据
            function updateInfo(index) {
                const idx = Math.min(index, precisionLevels.length - 1);
                const dec = precisionLevels[idx];
                const approx = approxValues[idx];
                const error = errorValues[idx];
                
                precisionEl.textContent = dec + ' 位';
                approxEl.textContent = approx.toFixed(dec);
                piEl.textContent = PI.toFixed(15);
                errorEl.textContent = error.toExponential(4);
            }

            // 初始显示第 10 位
            updateInfo(10);

            // 监听鼠标移动事件，更新信息面板
            myChart.on('mouseover', function(params) {
                if (params.componentType === 'series') {
                    const idx = params.dataIndex;
                    if (idx !== undefined) {
                        updateInfo(idx);
                    }
                }
            });

            // 鼠标移出时回到默认显示（第 10 位）
            myChart.on('mouseout', function() {
                updateInfo(10);
            });

            // 自适应
            window.addEventListener('resize', function() {
                myChart.resize();
            });

            console.log('✅ 22/7 精度变化图已加载');
            console.log(`📊 共 ${precisionLevels.length} 个精度级别，从 0 位到 20 位小数`);
            console.log(`🔵 22/7 精确值: ${EXACT_22_7}`);
            console.log(`🟠 π 真实值: ${PI}`);
        })();
    </script>
</body>
</html>

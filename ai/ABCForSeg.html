<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人工蜂群算法 · 图像分割演示</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #1a1e2c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #0f1219;
            border-radius: 2rem;
            padding: 2rem 2rem 1.8rem;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
            max-width: 1100px;
            width: 100%;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            color: #eef2ff;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0 0 0.25rem 0;
        }
        .subhead {
            color: #8b9bcc;
            font-size: 1rem;
            margin-top: 4px;
            margin-bottom: 1.75rem;
            border-left: 4px solid #ffb347;
            padding-left: 16px;
            background: linear-gradient(90deg, rgba(255, 180, 71, 0.08), transparent);
            border-radius: 0 0 0 0;
        }
        .main-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 28px;
            justify-content: center;
        }
        .image-area {
            flex: 2 1 420px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .canvas-wrapper {
            background: #0b0e14;
            border-radius: 1.5rem;
            padding: 12px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.8), 0 10px 20px -5px black;
        }
        .canvas-wrapper canvas {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 1rem;
            background: #1e2433;
            image-rendering: crisp-edges; /* 保留像素感 */
        }
        .controls {
            flex: 1 1 280px;
            background: #131823;
            border-radius: 1.8rem;
            padding: 1.8rem 1.5rem;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 8px 18px -6px black;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .control-group label {
            color: #b7c2e6;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .control-group label i {
            color: #ffb347;
            font-style: normal;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #ffb347;
            background: #202838;
            height: 6px;
            border-radius: 20px;
            -webkit-appearance: none;
            appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #ffb347;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 8px #ffb34788;
            border: 2px solid #0f1219;
        }
        .num-badge {
            background: #1e2433;
            color: #ffb347;
            border-radius: 24px;
            padding: 2px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-left: 8px;
            border: 1px solid #353f5a;
            font-family: monospace;
        }
        button {
            background: #ffb347;
            border: none;
            color: #0b0e14;
            font-weight: 700;
            font-size: 1rem;
            padding: 14px 16px;
            border-radius: 60px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.15s ease;
            box-shadow: 0 10px 20px -8px #ffb34770;
            letter-spacing: 0.4px;
            margin-top: 6px;
            border: 1px solid #ffcf87;
        }
        button:hover {
            background: #ffc16b;
            transform: scale(1.01);
            box-shadow: 0 14px 26px -8px #ffb347aa;
        }
        button:active {
            transform: scale(0.98);
            background: #e6a134;
        }
        button:disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.5);
        }
        .status {
            background: #0b0e16;
            border-radius: 40px;
            padding: 12px 18px;
            font-size: 0.9rem;
            color: #b0bfe0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #242c3f;
            font-family: monospace;
            margin-top: 10px;
        }
        .status span:first-child {
            color: #8f9dd0;
        }
        .status-value {
            color: #ffb347;
            font-weight: 700;
            background: #1e2433;
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 0.9rem;
        }
        .hint {
            font-size: 0.8rem;
            color: #6e7ea3;
            text-align: center;
            margin-top: 6px;
            line-height: 1.4;
        }
        .upload-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .file-label {
            background: #202838;
            padding: 10px 18px;
            border-radius: 40px;
            color: #ced9ff;
            font-size: 0.9rem;
            font-weight: 500;
            border: 1px solid #353f5a;
            cursor: pointer;
            transition: 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            justify-content: center;
        }
        .file-label:hover {
            background: #283040;
            border-color: #ffb34755;
        }
        input[type="file"] {
            display: none;
        }
        .seed-badge {
            font-size: 0.75rem;
            color: #5f6f92;
            text-align: right;
        }
        .canvas-caption {
            display: flex;
            justify-content: space-between;
            color: #8a99c0;
            font-size: 0.8rem;
            padding: 0 8px;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>🐝 人工蜂群 · 图像分割</h1>
    <div class="subhead">基于ABC算法寻找最优阈值 · 双峰图像分割</div>

    <div class="main-panel">
        <!-- 左侧图片/画布 -->
        <div class="image-area">
            <div class="canvas-wrapper">
                <canvas id="originalCanvas" width="400" height="300"></canvas>
            </div>
            <div class="canvas-caption">
                <span>原始图像</span>
                <span>灰度化 · 直方图均衡</span>
            </div>
            <div class="canvas-wrapper">
                <canvas id="segmentedCanvas" width="400" height="300"></canvas>
            </div>
            <div class="canvas-caption">
                <span>分割结果</span>
                <span id="thresholdDisplay">阈值: --</span>
            </div>
        </div>

        <!-- 右侧控制区 -->
        <div class="controls">
            <div class="upload-row">
                <label for="imageUpload" class="file-label">
                    📁 上传图片
                </label>
                <input type="file" id="imageUpload" accept="image/*">
            </div>

            <div class="control-group">
                <label>🐝 蜂群规模 <span class="num-badge" id="colonySizeVal">20</span></label>
                <input type="range" id="colonySize" min="6" max="60" step="2" value="20">
                <div class="hint">引领蜂 & 跟随蜂数量 (各一半)</div>
            </div>

            <div class="control-group">
                <label>🔁 最大迭代次数 <span class="num-badge" id="maxIterVal">30</span></label>
                <input type="range" id="maxIter" min="5" max="80" step="1" value="30">
            </div>

            <div class="control-group">
                <label>⏳ 限制搜索次数 <span class="num-badge" id="limitVal">10</span></label>
                <input type="range" id="limit" min="3" max="30" step="1" value="10">
                <div class="hint">超过 limit 次无改进则放弃蜜源</div>
            </div>

            <button id="runBtn">▶ 运行蜂群分割</button>

            <div class="status">
                <span>状态</span>
                <span class="status-value" id="statusText">就绪</span>
            </div>
            <div class="hint" id="fitnessHint">适应度 = 类间方差 (越大越好)</div>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---------- 全局变量 ----------
        const originalCanvas = document.getElementById('originalCanvas');
        const segmentedCanvas = document.getElementById('segmentedCanvas');
        const origCtx = originalCanvas.getContext('2d');
        const segCtx = segmentedCanvas.getContext('2d');

        // UI元素
        const colonySizeSlider = document.getElementById('colonySize');
        const colonySizeVal = document.getElementById('colonySizeVal');
        const maxIterSlider = document.getElementById('maxIter');
        const maxIterVal = document.getElementById('maxIterVal');
        const limitSlider = document.getElementById('limit');
        const limitVal = document.getElementById('limitVal');
        const runBtn = document.getElementById('runBtn');
        const statusText = document.getElementById('statusText');
        const thresholdDisplay = document.getElementById('thresholdDisplay');
        const fitnessHint = document.getElementById('fitnessHint');
        const fileInput = document.getElementById('imageUpload');

        // 图像数据 (灰度数组, 宽, 高)
        let grayImage = null;       // Uint8Array (长度 = width*height)
        let imageWidth = 400;
        let imageHeight = 300;
        // 缓存直方图 (256)
        let histogram = new Array(256).fill(0);
        // 当前分割阈值 (用于显示)
        let lastThreshold = -1;

        // ---------- 辅助函数 ----------
        // 更新滑块显示数值
        function updateSliderLabels() {
            colonySizeVal.textContent = colonySizeSlider.value;
            maxIterVal.textContent = maxIterSlider.value;
            limitVal.textContent = limitSlider.value;
        }
        colonySizeSlider.addEventListener('input', updateSliderLabels);
        maxIterSlider.addEventListener('input', updateSliderLabels);
        limitSlider.addEventListener('input', updateSliderLabels);
        updateSliderLabels();

        // ---------- 默认生成测试图 (双峰图 + 噪声) ----------
        function generateDefaultImage() {
            const w = 400, h = 300;
            imageWidth = w; imageHeight = h;
            const imgData = origCtx.createImageData(w, h);
            const data = imgData.data;
            const grayArr = new Uint8Array(w * h);

            // 构造一个左暗右亮、中间有过渡且加入噪声的图像 (方便分割演示)
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    // 基础渐变: 左边暗 (40~70), 右边亮 (180~220)
                    const t = x / w;  // 0~1
                    let base;
                    if (t < 0.5) {
                        // 暗区: 40~80
                        base = 40 + (t * 2) * 40; // 40~80
                    } else {
                        // 亮区: 160~220
                        base = 160 + ((t - 0.5) * 2) * 60; // 160~220
                    }
                    // 增加纵向微小变化
                    base += (y / h) * 15;
                    // 添加随机噪声 (±18)
                    const noise = (Math.random() - 0.5) * 36;
                    let val = Math.round(base + noise);
                    val = Math.min(255, Math.max(0, val));
                    const idx = y * w + x;
                    grayArr[idx] = val;
                    // 写入ImageData (灰度值)
                    const p = idx * 4;
                    data[p] = val;
                    data[p+1] = val;
                    data[p+2] = val;
                    data[p+3] = 255;
                }
            }
            origCtx.putImageData(imgData, 0, 0);
            grayImage = grayArr;
            computeHistogram();
            // 清除分割画布并显示灰色
            segCtx.fillStyle = '#1e2433';
            segCtx.fillRect(0, 0, w, h);
            lastThreshold = -1;
            thresholdDisplay.textContent = '阈值: --';
            statusText.textContent = '已加载测试图';
        }

        // 计算直方图 (根据grayImage)
        function computeHistogram() {
            histogram.fill(0);
            if (!grayImage) return;
            for (let i = 0; i < grayImage.length; i++) {
                histogram[grayImage[i]]++;
            }
        }

        // 从上传文件读取图像并转为灰度, 重绘originalCanvas
        function loadImageFromFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        // 调整画布尺寸以匹配图片比例但限制最大宽高 (保持显示合理)
                        const maxW = 500, maxH = 400;
                        let w = img.width, h = img.height;
                        const scale = Math.min(maxW / w, maxH / h, 1);
                        w = Math.round(w * scale);
                        h = Math.round(h * scale);
                        originalCanvas.width = w;
                        originalCanvas.height = h;
                        segmentedCanvas.width = w;
                        segmentedCanvas.height = h;
                        imageWidth = w; imageHeight = h;

                        // 绘制原始图像 (彩色用于显示，但是算法用灰度)
                        origCtx.drawImage(img, 0, 0, w, h);
                        // 获取像素数据，转为灰度数组
                        const imgData = origCtx.getImageData(0, 0, w, h);
                        const data = imgData.data;
                        const grayArr = new Uint8Array(w * h);
                        for (let i = 0; i < grayArr.length; i++) {
                            const r = data[i*4];
                            const g = data[i*4+1];
                            const b = data[i*4+2];
                            // 亮度公式
                            const gray = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
                            grayArr[i] = gray;
                            // 同时将原画布重新绘制为灰度(保持视觉一致，但保留原始显示可彩色，不过为了对比，我们保留彩色也行。但为了直观显示，可以稍微保留彩色。保持彩色不变，因为canvas已经画了彩色)
                        }
                        // 将灰度图存起来
                        grayImage = grayArr;
                        computeHistogram();
                        // 重置分割画布为原图(先显示原图? 清成灰色)
                        segCtx.fillStyle = '#1e2433';
                        segCtx.fillRect(0, 0, w, h);
                        // 将原图也绘制到分割画布上作为浅色背景? 可以但不太干净，我们直接清灰
                        lastThreshold = -1;
                        thresholdDisplay.textContent = '阈值: --';
                        statusText.textContent = '图片已加载';
                        resolve();
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // 文件上传监听
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                loadImageFromFile(e.target.files[0]).catch(err => {
                    statusText.textContent = '图片加载失败';
                });
            }
        });

        // ---------- 适应度函数: 基于Otsu类间方差 ----------
        // 传入阈值 t (0~255), 返回类间方差 (归一化大小)
        function fitnessOtsu(t) {
            if (!grayImage) return 0;
            const totalPixels = grayImage.length;
            if (totalPixels === 0) return 0;
            // 计算背景 (0~t) 和前景 (t+1~255) 的权重和均值
            let sumB = 0, sumF = 0;      // 灰度总和
            let weightB = 0, weightF = 0;
            for (let i = 0; i <= t; i++) {
                weightB += histogram[i];
                sumB += i * histogram[i];
            }
            for (let i = t + 1; i < 256; i++) {
                weightF += histogram[i];
                sumF += i * histogram[i];
            }
            // 如果某一类为空，适应度为0 (惩罚)
            if (weightB === 0 || weightF === 0) return 0;
            const meanB = sumB / weightB;
            const meanF = sumF / weightF;
            const weightB_norm = weightB / totalPixels;
            const weightF_norm = weightF / totalPixels;
            // 类间方差: w0 * w1 * (mean0 - mean1)^2
            const betweenVar = weightB_norm * weightF_norm * (meanB - meanF) ** 2;
            return betweenVar;
        }

        // 根据阈值分割图像并绘制到segmentedCanvas
        function applyThresholdToCanvas(threshold) {
            if (!grayImage || threshold < 0) return;
            const w = imageWidth, h = imageHeight;
            const imgData = segCtx.createImageData(w, h);
            const data = imgData.data;
            const thresh = Math.min(255, Math.max(0, threshold));
            for (let i = 0; i < grayImage.length; i++) {
                const val = grayImage[i];
                // 二值化: 大于阈值为白色(255), 否则黑色(0)
                const bin = val > thresh ? 255 : 0;
                const p = i * 4;
                data[p] = bin;
                data[p+1] = bin;
                data[p+2] = bin;
                data[p+3] = 255;
            }
            segCtx.putImageData(imgData, 0, 0);
            lastThreshold = thresh;
            thresholdDisplay.textContent = `阈值: ${thresh}`;
        }

        // ---------- 人工蜂群算法 (ABC) 优化阈值 ----------
        // 返回最优阈值 (整数)
        async function runABC() {
            if (!grayImage) {
                statusText.textContent = '请先加载图片';
                return null;
            }

            // 读取参数
            const colonySize = parseInt(colonySizeSlider.value, 10); // 总蜂群数量 (引领蜂+跟随蜂)
            const maxIter = parseInt(maxIterSlider.value, 10);
            const limit = parseInt(limitSlider.value, 10);
            const dim = 1;  // 一维阈值搜索
            const lb = 0;   // 下界
            const ub = 255; // 上界

            // 引领蜂数量 = 跟随蜂数量 = colonySize/2 (向下取整, 但至少1)
            const numEmployed = Math.max(1, Math.floor(colonySize / 2));
            const numOnlooker = Math.max(1, colonySize - numEmployed); // 剩余作为跟随蜂，总数可能为奇数, 但没问题

            // 初始化蜜源 (每个引领蜂对应一个蜜源) - 位置为[0,255]整数
            let foods = new Array(numEmployed);
            let fitness = new Array(numEmployed);
            let trial = new Array(numEmployed).fill(0); // 未改进计数

            // 随机初始化
            for (let i = 0; i < numEmployed; i++) {
                const pos = Math.floor(Math.random() * 256); // 0~255
                foods[i] = pos;
                fitness[i] = fitnessOtsu(pos);
            }

            // 记录全局最优
            let bestIdx = 0;
            for (let i = 1; i < numEmployed; i++) {
                if (fitness[i] > fitness[bestIdx]) bestIdx = i;
            }
            let globalBestPos = foods[bestIdx];
            let globalBestFit = fitness[bestIdx];

            // 迭代
            for (let iter = 0; iter < maxIter; iter++) {
                // 1. 引领蜂阶段: 每个引领蜂在邻域搜索新位置
                for (let i = 0; i < numEmployed; i++) {
                    // 随机选择另一个蜜源 (k != i)
                    let k = Math.floor(Math.random() * numEmployed);
                    while (k === i && numEmployed > 1) {
                        k = Math.floor(Math.random() * numEmployed);
                    }
                    // 随机维度 (这里只有一维) 及随机数 phi in [-1, 1]
                    const phi = (Math.random() * 2) - 1;
                    // 新位置 v = x_i + phi * (x_i - x_k)
                    let newPos = foods[i] + phi * (foods[i] - foods[k]);
                    // 边界处理 & 取整 (因为阈值是整数)
                    newPos = Math.round(newPos);
                    newPos = Math.min(ub, Math.max(lb, newPos));

                    // 计算新适应度
                    const newFit = fitnessOtsu(newPos);

                    // 贪婪选择
                    if (newFit > fitness[i]) {
                        foods[i] = newPos;
                        fitness[i] = newFit;
                        trial[i] = 0;  // 重置计数
                    } else {
                        trial[i]++;     // 未改进
                    }
                }

                // 2. 跟随蜂阶段: 根据适应度计算选择概率 (轮盘赌)
                const totalFit = fitness.reduce((a, b) => a + b, 0);
                for (let j = 0; j < numOnlooker; j++) {
                    let prob = Math.random() * totalFit;
                    let selected = 0;
                    for (let i = 0; i < numEmployed; i++) {
                        prob -= fitness[i];
                        if (prob <= 0) {
                            selected = i;
                            break;
                        }
                    }
                    // 对选中的蜜源进行邻域搜索 (类似引领蜂)
                    const i = selected;
                    let k = Math.floor(Math.random() * numEmployed);
                    while (k === i && numEmployed > 1) {
                        k = Math.floor(Math.random() * numEmployed);
                    }
                    const phi = (Math.random() * 2) - 1;
                    let newPos = foods[i] + phi * (foods[i] - foods[k]);
                    newPos = Math.round(newPos);
                    newPos = Math.min(ub, Math.max(lb, newPos));
                    const newFit = fitnessOtsu(newPos);

                    if (newFit > fitness[i]) {
                        foods[i] = newPos;
                        fitness[i] = newFit;
                        trial[i] = 0;
                    } else {
                        trial[i]++;
                    }
                }

                // 3. 侦察蜂阶段: 检查是否有超过limit的蜜源, 若有则随机重置
                for (let i = 0; i < numEmployed; i++) {
                    if (trial[i] > limit) {
                        // 随机生成新位置
                        const newPos = Math.floor(Math.random() * 256);
                        foods[i] = newPos;
                        fitness[i] = fitnessOtsu(newPos);
                        trial[i] = 0;
                    }
                }

                // 更新全局最优
                for (let i = 0; i < numEmployed; i++) {
                    if (fitness[i] > globalBestFit) {
                        globalBestFit = fitness[i];
                        globalBestPos = foods[i];
                    }
                }

                // 每5轮更新一次UI和状态 (让浏览器有机会渲染)
                if (iter % 5 === 0 || iter === maxIter - 1) {
                    statusText.textContent = `迭代 ${iter+1}/${maxIter} | 最优适应度: ${globalBestFit.toFixed(6)}`;
                    fitnessHint.textContent = `类间方差: ${globalBestFit.toFixed(6)} (越大越好)`;
                    // 应用当前最优阈值预览
                    applyThresholdToCanvas(globalBestPos);
                    // 让出主线程，避免卡顿
                    await new Promise(r => setTimeout(r, 0));
                }
            }

            // 最终应用最优阈值
            const bestThresh = Math.round(globalBestPos);
            applyThresholdToCanvas(bestThresh);
            statusText.textContent = `完成 · 最优阈值: ${bestThresh} | 适应度: ${globalBestFit.toFixed(6)}`;
            fitnessHint.textContent = `类间方差: ${globalBestFit.toFixed(6)} (越大越好)`;
            return bestThresh;
        }

        // ---------- 按钮点击事件 ----------
        runBtn.addEventListener('click', async () => {
            if (!grayImage) {
                statusText.textContent = '请先上传或使用默认图片';
                return;
            }
            runBtn.disabled = true;
            statusText.textContent = '蜂群搜索中...';
            thresholdDisplay.textContent = '阈值: --';
            // 清除分割画布，避免旧结果干扰
            segCtx.fillStyle = '#1e2433';
            segCtx.fillRect(0, 0, imageWidth, imageHeight);
            // 稍微延迟以更新UI
            await new Promise(r => setTimeout(r, 20));
            try {
                await runABC();
            } catch (e) {
                console.error(e);
                statusText.textContent = '运行出错';
            } finally {
                runBtn.disabled = false;
            }
        });

        // ---------- 页面初始化 ----------
        function init() {
            // 生成默认图
            generateDefaultImage();
            // 应用初始阈值(例如128)展示? 可不用, 或者显示一个中间值。
            // 但为了演示，可以显示一个随机阈值或等待用户点击。
            // 设置默认状态
            statusText.textContent = '就绪，点击运行';
            fitnessHint.textContent = '适应度 = 类间方差 (越大越好)';
            thresholdDisplay.textContent = '阈值: --';
            // 画布尺寸已设置
        }

        init();

        // 窗口大小变化时, 不做处理; canvas尺寸固定

        // 如果用户上传图片, 重新初始化。已在事件中处理。
        // 另外，如果用户上传图片后，要清空之前的阈值显示
    })();
</script>
</body>
</html>

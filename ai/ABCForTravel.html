<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人工蜂群算法 · 旅行商问题演示</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }
    body {
      background: #1a2a32;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: #0f1a1f;
      border-radius: 32px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      padding: 24px 28px 30px;
      max-width: 1100px;
      width: 100%;
      border: 1px solid #3e5e6b;
    }
    h1 {
      text-align: center;
      font-weight: 500;
      letter-spacing: 2px;
      font-size: 1.8rem;
      margin: 0 0 8px 0;
      color: #c7e9f2;
      text-shadow: 0 2px 6px #00000050;
    }
    .subtitle {
      text-align: center;
      color: #89b9c9;
      margin-bottom: 22px;
      font-size: 0.95rem;
      border-bottom: 1px solid #2f4a55;
      padding-bottom: 12px;
    }
    .canvas-wrapper {
      display: flex;
      justify-content: center;
      background: #0b1418;
      border-radius: 24px;
      padding: 10px;
      box-shadow: inset 0 0 12px #00000070;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      max-width: 760px;
      border-radius: 18px;
      background: #13232b;
      cursor: default;
      border: 2px solid #2f4f5b;
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-top: 22px;
      gap: 16px;
    }
    .stat-item {
      background: #1c2f38;
      border-radius: 50px;
      padding: 10px 24px;
      color: #d9f2fa;
      font-weight: 500;
      border: 1px solid #3d5e6b;
      box-shadow: 0 4px 8px #00000030;
      flex: 1 1 180px;
      text-align: center;
      font-size: 1rem;
    }
    .stat-item span {
      font-weight: 700;
      color: #f5e56b;
      margin-left: 8px;
      font-size: 1.15rem;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      margin-top: 20px;
    }
    button {
      background: #2a4a58;
      border: none;
      color: #e4f2f7;
      font-weight: 600;
      font-size: 1rem;
      padding: 12px 30px;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 0.5px;
      box-shadow: 0 6px 0 #0f1e24, 0 8px 14px #00000060;
      transition: all 0.08s ease;
      border: 1px solid #4d7c8c;
      flex: 0 1 auto;
    }
    button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0f1e24, 0 5px 10px #00000060;
    }
    button:disabled {
      opacity: 0.4;
      transform: translateY(2px);
      box-shadow: 0 4px 0 #0f1e24, 0 5px 10px #00000060;
      pointer-events: none;
      cursor: not-allowed;
    }
    .algo-badge {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 14px;
      color: #7ba3b3;
      font-size: 0.85rem;
    }
    .algo-badge i {
      font-style: normal;
      background: #1c323b;
      padding: 4px 12px;
      border-radius: 30px;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>🐝 人工蜂群算法 · 旅行商问题</h1>
  <div class="subtitle">ABC · 雇佣蜂 / 观察蜂 / 侦察蜂</div>

  <div class="canvas-wrapper">
    <canvas id="tspCanvas" width="760" height="500"></canvas>
  </div>

  <div class="stats">
    <div class="stat-item">最短路径 <span id="bestLength">—</span></div>
    <div class="stat-item">迭代次数 <span id="iterCount">0</span></div>
    <div class="stat-item">蜜蜂数量 <span id="beeCount">30</span></div>
  </div>

  <div class="controls">
    <button id="resetBtn">🔄 重置城市</button>
    <button id="startBtn">▶ 开始 / 继续</button>
    <button id="pauseBtn" disabled>⏸ 暂停</button>
    <button id="stepBtn">⏭ 单步迭代</button>
  </div>
  <div class="algo-badge">
    <i>雇佣蜂: 局部搜索</i>
    <i>观察蜂: 轮盘赌选择</i>
    <i>侦察蜂: 随机新解</i>
  </div>
</div>

<script>
  (function() {
    // ---------- 画布和上下文 ----------
    const canvas = document.getElementById('tspCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    // ---------- 问题规模 ----------
    const CITY_COUNT = 20;               // 20个城市，视觉舒适
    const BEES = 30;                    // 蜂群数量（雇佣蜂=30，观察蜂=30）
    const MAX_ITER = 300;               // 最大迭代次数（实际不会严格限制）
    const LIMIT = 40;                   // 放弃当前解的阈值（侦察蜂触发）

    // 城市坐标
    let cities = [];
    // 当前迭代中雇佣蜂的路径 (每个蜜蜂一条路径)
    let employedPaths = [];
    // 每个雇佣蜂路径的长度
    let employedCosts = [];
    // 对应蜜蜂的停滞计数 (trial)
    let trialCounts = [];
    // 全局最优路径和长度
    let bestPath = [];
    let bestCost = Infinity;
    // 当前迭代次数
    let iteration = 0;
    // 算法状态
    let isRunning = false;
    let timer = null;

    // 可视化相关
    let animationSpeed = 200; // 毫秒每次迭代

    // ---------- 工具函数 ----------
    function distance(p1, p2) {
      return Math.hypot(p1.x - p2.x, p1.y - p2.y);
    }

    function computeTotalDistance(path) {
      let d = 0;
      for (let i = 0; i < path.length - 1; i++) {
        d += distance(cities[path[i]], cities[path[i+1]]);
      }
      d += distance(cities[path[path.length-1]], cities[path[0]]);
      return d;
    }

    // 生成一个随机排列 (0..n-1)
    function randomPermutation(n) {
      const arr = Array.from({ length: n }, (_, i) => i);
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // 深拷贝路径
    function copyPath(path) {
      return path.slice();
    }

    // 生成新的随机路径 (随机排列)
    function generateRandomPath() {
      return randomPermutation(CITY_COUNT);
    }

    // 随机生成城市坐标 (限制在画布内边距)
    function generateCities() {
      const newCities = [];
      const padding = 45;
      for (let i = 0; i < CITY_COUNT; i++) {
        newCities.push({
          x: padding + Math.random() * (W - 2 * padding),
          y: padding + Math.random() * (H - 2 * padding),
        });
      }
      return newCities;
    }

    // ---------- 初始化 / 重置 ----------
    function resetAlgorithm() {
      // 停止运行
      stopRunning();
      // 生成新城市
      cities = generateCities();
      // 随机初始化雇佣蜂路径
      employedPaths = [];
      employedCosts = [];
      trialCounts = [];
      for (let i = 0; i < BEES; i++) {
        const path = generateRandomPath();
        const cost = computeTotalDistance(path);
        employedPaths.push(path);
        employedCosts.push(cost);
        trialCounts.push(0);
        // 更新全局最优
        if (cost < bestCost) {
          bestCost = cost;
          bestPath = copyPath(path);
        }
      }
      // 重置全局最优
      bestCost = Infinity;
      bestPath = [];
      for (let i = 0; i < BEES; i++) {
        if (employedCosts[i] < bestCost) {
          bestCost = employedCosts[i];
          bestPath = copyPath(employedPaths[i]);
        }
      }
      iteration = 0;
      // 更新UI
      updateStats();
      draw();
      // 按钮状态
      updateButtons();
    }

    // 完全重置 (城市也重新生成)
    function fullReset() {
      stopRunning();
      // 重置全局最优
      bestCost = Infinity;
      bestPath = [];
      // 重新生成城市和蜜蜂
      cities = generateCities();
      employedPaths = [];
      employedCosts = [];
      trialCounts = [];
      for (let i = 0; i < BEES; i++) {
        const path = generateRandomPath();
        const cost = computeTotalDistance(path);
        employedPaths.push(path);
        employedCosts.push(cost);
        trialCounts.push(0);
        if (cost < bestCost) {
          bestCost = cost;
          bestPath = copyPath(path);
        }
      }
      iteration = 0;
      updateStats();
      draw();
      updateButtons();
    }

    // ---------- 核心：人工蜂群算法一次迭代 ----------
    function abcIteration() {
      // 1. 雇佣蜂阶段：对每个雇佣蜂，在当前解附近生成新解（交换/逆序），贪婪选择
      for (let i = 0; i < BEES; i++) {
        const currentPath = employedPaths[i];
        const currentCost = employedCosts[i];

        // 产生邻域解 (随机交换两个城市 or 逆序一段)
        let newPath = copyPath(currentPath);
        // 随机选择邻域操作：交换两个位置 或 逆序一个片段
        if (Math.random() < 0.6) {
          // 交换
          const pos1 = Math.floor(Math.random() * CITY_COUNT);
          let pos2 = Math.floor(Math.random() * CITY_COUNT);
          while (pos2 === pos1) pos2 = Math.floor(Math.random() * CITY_COUNT);
          [newPath[pos1], newPath[pos2]] = [newPath[pos2], newPath[pos1]];
        } else {
          // 逆序片段
          let start = Math.floor(Math.random() * CITY_COUNT);
          let end = Math.floor(Math.random() * CITY_COUNT);
          if (start > end) [start, end] = [end, start];
          if (start === end) {
            // 至少长度2
            end = (start + 1) % CITY_COUNT;
            if (start > end) [start, end] = [end, start];
          }
          while (start < end) {
            [newPath[start], newPath[end]] = [newPath[end], newPath[start]];
            start++;
            end--;
          }
        }

        const newCost = computeTotalDistance(newPath);

        // 贪婪选择
        if (newCost < currentCost) {
          employedPaths[i] = newPath;
          employedCosts[i] = newCost;
          trialCounts[i] = 0;   // 重置计数器
          // 更新全局最优
          if (newCost < bestCost) {
            bestCost = newCost;
            bestPath = copyPath(newPath);
          }
        } else {
          trialCounts[i] += 1;
        }
      }

      // 2. 观察蜂阶段：根据适应度(轮盘赌)选择雇佣蜂，在其邻域搜索
      // 计算适应度 (路径越短适应度越大)
      const fitness = employedCosts.map(c => 1 / (c + 1e-6));
      const totalFitness = fitness.reduce((a, b) => a + b, 0);
      // 归一化概率
      const probs = fitness.map(f => f / totalFitness);

      for (let b = 0; b < BEES; b++) {
        // 轮盘赌选择一只雇佣蜂
        let r = Math.random();
        let selectedIdx = 0;
        let cum = 0;
        for (let i = 0; i < BEES; i++) {
          cum += probs[i];
          if (r <= cum) {
            selectedIdx = i;
            break;
          }
        }
        // 选中的雇佣蜂路径
        const basePath = employedPaths[selectedIdx];
        const baseCost = employedCosts[selectedIdx];

        // 产生邻域解 (与雇佣蜂类似)
        let newPath = copyPath(basePath);
        if (Math.random() < 0.6) {
          const pos1 = Math.floor(Math.random() * CITY_COUNT);
          let pos2 = Math.floor(Math.random() * CITY_COUNT);
          while (pos2 === pos1) pos2 = Math.floor(Math.random() * CITY_COUNT);
          [newPath[pos1], newPath[pos2]] = [newPath[pos2], newPath[pos1]];
        } else {
          let start = Math.floor(Math.random() * CITY_COUNT);
          let end = Math.floor(Math.random() * CITY_COUNT);
          if (start > end) [start, end] = [end, start];
          if (start === end) {
            end = (start + 1) % CITY_COUNT;
            if (start > end) [start, end] = [end, start];
          }
          while (start < end) {
            [newPath[start], newPath[end]] = [newPath[end], newPath[start]];
            start++;
            end--;
          }
        }

        const newCost = computeTotalDistance(newPath);

        // 观察蜂也采用贪婪选择，更新到对应的雇佣蜂位置(或全局)
        if (newCost < baseCost) {
          // 更新该雇佣蜂的解 (相当于观察蜂帮助改进)
          employedPaths[selectedIdx] = newPath;
          employedCosts[selectedIdx] = newCost;
          trialCounts[selectedIdx] = 0;
          if (newCost < bestCost) {
            bestCost = newCost;
            bestPath = copyPath(newPath);
          }
        } else {
          trialCounts[selectedIdx] += 1;
        }
      }

      // 3. 侦察蜂阶段：检查是否有超过LIMIT未改进的雇佣蜂，若有则随机重置
      for (let i = 0; i < BEES; i++) {
        if (trialCounts[i] > LIMIT) {
          // 随机生成新路径
          const newPath = generateRandomPath();
          const newCost = computeTotalDistance(newPath);
          employedPaths[i] = newPath;
          employedCosts[i] = newCost;
          trialCounts[i] = 0;
          // 更新全局最优
          if (newCost < bestCost) {
            bestCost = newCost;
            bestPath = copyPath(newPath);
          }
        }
      }

      // 迭代次数增加
      iteration++;
      // 更新UI并重绘
      updateStats();
      draw();
    }

    // ---------- 绘制可视化 ----------
    function draw() {
      ctx.clearRect(0, 0, W, H);

      // 绘制所有城市 (小圆圈)
      cities.forEach((city, index) => {
        ctx.beginPath();
        ctx.arc(city.x, city.y, 6, 0, 2 * Math.PI);
        ctx.fillStyle = '#9ad9e8';
        ctx.shadowColor = '#7fc1d0';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0; // 重置阴影，否则影响后面
        ctx.strokeStyle = '#d4f4ff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // 城市编号
        ctx.fillStyle = '#ddf4ff';
        ctx.font = 'bold 11px "Segoe UI", monospace';
        ctx.shadowBlur = 6;
        ctx.shadowColor = '#1a3a44';
        ctx.fillText(index + 1, city.x + 10, city.y - 10);
        ctx.shadowBlur = 0;
      });

      // 绘制当前最优路径 (高亮)
      if (bestPath.length === CITY_COUNT) {
        ctx.beginPath();
        const first = cities[bestPath[0]];
        ctx.moveTo(first.x, first.y);
        for (let i = 1; i < bestPath.length; i++) {
          const city = cities[bestPath[i]];
          ctx.lineTo(city.x, city.y);
        }
        ctx.closePath();
        ctx.strokeStyle = '#f5e56b';
        ctx.lineWidth = 3.5;
        ctx.shadowColor = '#ffd966';
        ctx.shadowBlur = 16;
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      // 用半透明线绘制几个雇佣蜂的路径作为背景(增加动感) —— 只画前3条，避免太乱
      const drawCount = Math.min(3, employedPaths.length);
      for (let k = 0; k < drawCount; k++) {
        const path = employedPaths[k];
        if (!path || path.length !== CITY_COUNT) continue;
        ctx.beginPath();
        const first = cities[path[0]];
        ctx.moveTo(first.x, first.y);
        for (let i = 1; i < path.length; i++) {
          const city = cities[path[i]];
          ctx.lineTo(city.x, city.y);
        }
        ctx.closePath();
        ctx.strokeStyle = `rgba(120, 200, 220, 0.2)`;
        ctx.lineWidth = 1.2;
        ctx.shadowBlur = 0;
        ctx.stroke();
      }

      // 如果城市为空或路径不完整则忽略
    }

    // ---------- 更新统计信息 ----------
    function updateStats() {
      document.getElementById('bestLength').innerText = bestCost === Infinity ? '—' : bestCost.toFixed(2);
      document.getElementById('iterCount').innerText = iteration;
      document.getElementById('beeCount').innerText = BEES;
    }

    // ---------- 按钮状态管理 ----------
    function updateButtons() {
      const startBtn = document.getElementById('startBtn');
      const pauseBtn = document.getElementById('pauseBtn');
      const stepBtn = document.getElementById('stepBtn');
      const resetBtn = document.getElementById('resetBtn');

      if (isRunning) {
        startBtn.disabled = true;
        pauseBtn.disabled = false;
        stepBtn.disabled = true;
        resetBtn.disabled = false;   // 重置可用（会停止）
      } else {
        startBtn.disabled = false;
        pauseBtn.disabled = true;
        stepBtn.disabled = false;
        resetBtn.disabled = false;
      }
    }

    // ---------- 控制逻辑 ----------
    function startRunning() {
      if (isRunning) return;
      // 如果已经是最大迭代次数附近? 但无所谓
      isRunning = true;
      if (timer) clearInterval(timer);
      timer = setInterval(() => {
        abcIteration();
        // 如果迭代次数达到MAX_ITER，可以停止(但演示可以继续)
        // 为了不无限，但无伤大雅。也可保留。
        if (iteration >= MAX_ITER) {
          // 但我们可以继续，或者停止。这里选择如果达到最大迭代就暂停自动
          // 但为了演示持续运行，我们选择不停止，但可以重置迭代显示？不用
          // 只是演示，继续。但为了防止一直跑，可以让用户决定。
          // 我们保留自动运行，直到用户暂停。
        }
      }, animationSpeed);
      updateButtons();
    }

    function stopRunning() {
      if (timer) {
        clearInterval(timer);
        timer = null;
      }
      isRunning = false;
      updateButtons();
    }

    function pauseRunning() {
      stopRunning();
    }

    function singleStep() {
      if (isRunning) {
        stopRunning(); // 如果正在运行，先停止
      }
      abcIteration();
      updateButtons();
    }

    // ---------- 绑定事件 ----------
    function bindEvents() {
      document.getElementById('resetBtn').addEventListener('click', () => {
        fullReset();
      });
      document.getElementById('startBtn').addEventListener('click', () => {
        // 如果已经迭代了很多，继续
        startRunning();
      });
      document.getElementById('pauseBtn').addEventListener('click', () => {
        pauseRunning();
      });
      document.getElementById('stepBtn').addEventListener('click', () => {
        singleStep();
      });
    }

    // ---------- 初始化 ----------
    function init() {
      fullReset();  // 生成城市和初始蜂群
      bindEvents();
      // 初始绘制
      draw();
    }

    init();
  })();
</script>
</body>
</html>

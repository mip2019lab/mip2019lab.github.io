<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 数据清洗 · 制表符XLS转CSV</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f4f7fb;
            padding: 2rem 1.5rem;
            color: #1e2b3c;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 {
            font-size: 2rem; font-weight: 500;
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 0.5rem; color: #0b2b4a;
        }
        h1 small { font-size: 1rem; font-weight: 400; color: #4e6e8c; margin-left: 12px; }
        .subhead {
            font-size: 0.95rem; color: #3b5b7a;
            margin-bottom: 2rem;
            border-left: 4px solid #2a7faa;
            padding: 10px 18px;
            background: #eaf1f9;
            border-radius: 0 8px 8px 0;
            display: inline-block;
        }
        .card {
            background: #ffffff; border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0, 20, 40, 0.08);
            padding: 1.8rem 2rem; margin-bottom: 2rem;
            border: 1px solid #dbe6f0;
        }
        .file-zone {
            display: flex; flex-wrap: wrap; align-items: center;
            gap: 1.2rem; margin-bottom: 1.8rem;
        }
        .file-label {
            background: #1d3f5e; color: white;
            padding: 0.75rem 2rem; border-radius: 60px;
            font-weight: 500; display: inline-flex; align-items: center;
            gap: 8px; cursor: pointer; transition: background 0.2s;
            border: none; font-size: 1rem;
        }
        .file-label:hover { background: #0f2c44; }
        .file-label input { display: none; }
        .file-name {
            color: #2d4b67; font-weight: 500;
            background: #eef3f9; padding: 0.5rem 1.2rem;
            border-radius: 40px; font-size: 0.95rem;
            border: 1px solid #c9d9e8; word-break: break-all;
        }
        .btn {
            background: #2a7faa; border: none; color: white;
            padding: 0.75rem 2rem; border-radius: 60px;
            font-weight: 500; font-size: 1rem; cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: inline-flex; align-items: center;
            gap: 8px; border: 1px solid #1f6b8f;
        }
        .btn:hover { background: #1f6b8f; }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { background: #a0bbce; border-color: #8aa8be; cursor: not-allowed; }
        .btn-outline { background: transparent; color: #1d3f5e; border: 1px solid #b8cee2; }
        .btn-outline:hover { background: #e5eff8; }
        .status {
            margin-top: 1.2rem; font-size: 0.95rem;
            background: #f0f6fe; border-radius: 12px;
            padding: 1rem 1.5rem;
            border-left: 6px solid #2a7faa;
            white-space: pre-wrap; word-break: break-word;
            max-height: 200px; overflow-y: auto;
            font-family: 'SF Mono', 'Consolas', monospace;
            line-height: 1.5;
        }
        .status.error { border-left-color: #c0392b; background: #fcebea; color: #7a2e27; }
        .status.success { border-left-color: #1e7e34; background: #e7f5eb; }
        .preview-title {
            font-weight: 600; margin: 1.8rem 0 1rem 0;
            font-size: 1.2rem; color: #123456;
            display: flex; align-items: center; gap: 12px;
        }
        .preview-title span {
            background: #cbdceb; border-radius: 30px;
            padding: 4px 14px; font-size: 0.85rem;
            font-weight: 500; color: #1f4665;
        }
        .table-wrapper {
            overflow-x: auto; border-radius: 18px;
            border: 1px solid #d3e0ec; background: white;
            max-height: 380px; overflow-y: auto;
        }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; white-space: nowrap; }
        th {
            background: #1d3f5e; color: white; font-weight: 500;
            padding: 12px 16px; text-align: left;
            position: sticky; top: 0; z-index: 5;
            font-size: 0.85rem; letter-spacing: 0.3px;
        }
        td { padding: 10px 16px; border-bottom: 1px solid #e2ebf3; color: #1a3047; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f2f8ff; }
        .flex-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; }
        .columns-list {
            font-family: monospace; font-size: 0.8rem;
            background: #eef3f9; padding: 0.3rem 0.8rem;
            border-radius: 40px; color: #173e5c;
        }
        .note { font-size: 0.85rem; color: #4b6885; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 数据清洗转换器 <small>制表符分隔 .xls → 结构化 CSV</small></h1>
        <div class="subhead">
            ⚡ 完全基于原 Python 脚本逻辑: 跳过前2行元数据 → 删除前2行数据 → 删除最后1行 → 重命名列 → 日期清理 → 数值转 float64 → 导出 CSV
        </div>

        <!-- 主卡片 -->
        <div class="card">
            <div class="file-zone">
                <label class="file-label">
                    📂 选择 .xls 文件
                    <input type="file" id="fileInput" accept=".xls,.xlsx,text/plain,application/vnd.ms-excel">
                </label>
                <span class="file-name" id="fileNameDisplay">尚未选择文件</span>
                <button class="btn" id="processBtn" disabled>▶ 处理并预览</button>
                <button class="btn btn-outline" id="downloadBtn" disabled>⬇ 下载 CSV</button>
            </div>
            <div id="statusMessage" class="status">等待上传文件...</div>
        </div>

        <!-- 预览卡片 -->
        <div class="card" id="previewCard" style="display: none;">
            <div class="flex-row">
                <div class="preview-title" style="margin:0;">
                    📋 处理结果预览 <span id="shapeBadge">0 行 × 0 列</span>
                </div>
                <div class="columns-list" id="columnsSummary">列: —</div>
            </div>
            <div class="note" id="dtypeNote" style="margin-bottom: 1rem;"></div>
            <div class="table-wrapper">
                <table id="previewTable">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div class="note" style="margin-top: 12px; text-align: right; color: #3b658b;">
                ␣ 仅显示前 30 行 · 完整数据请下载 CSV
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ---------- 全局变量 ----------
            let currentRawText = null;
            let currentFileName = '';
            let processedData = null;
            let processedColumns = [];
            let processedRows = [];

            // DOM
            const fileInput = document.getElementById('fileInput');
            const fileNameDisplay = document.getElementById('fileNameDisplay');
            const processBtn = document.getElementById('processBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const statusDiv = document.getElementById('statusMessage');
            const previewCard = document.getElementById('previewCard');
            const tableHead = document.getElementById('tableHead');
            const tableBody = document.getElementById('tableBody');
            const shapeBadge = document.getElementById('shapeBadge');
            const columnsSummary = document.getElementById('columnsSummary');
            const dtypeNote = document.getElementById('dtypeNote');

            // ---------- 工具函数 ----------

            // 原生 TSV 解析器（替代 PapaParse）
            // 输入：以 \n 分隔的字符串；输出：二维数组（每行是字段数组）
            function parseTSV(text) {
                // 统一换行符
                const normalized = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
                // 按行分割
                const lines = normalized.split('\n');
                // 去除末尾空行
                while (lines.length && lines[lines.length - 1].trim() === '') {
                    lines.pop();
                }
                const rows = [];
                for (let i = 0; i < lines.length; i++) {
                    // 按制表符分割（不处理引号，原脚本读取TSV文件时 pandas 默认 quotechar='"'，但多数金融导出无引号）
                    // 注意：为了与 pandas 行为接近，我们对简单引号做基本处理
                    let line = lines[i];
                    // 如果行首尾是引号，去掉（简单处理）
                    // 但如果字段内有引号，我们不做复杂处理，因为原脚本 pandas 默认会处理，但这里作为替代，保持简单
                    // 实际金融数据TSV很少包含引号包裹字段，如果有，可能会出问题，但暂不引入复杂解析器
                    const cols = line.split('\t');
                    rows.push(cols);
                }
                return rows;
            }

            // 列名映射 (完全按照原 Python 脚本逻辑)
            function renameColumns(columns) {
                return columns.map(col => {
                    const c = (col || '').trim();
                    const lower = c.toLowerCase();
                    if (c.includes('时间') || lower.includes('date')) return 'date';
                    else if (c.includes('开盘') || lower.includes('open')) return 'open';
                    else if (c.includes('最高') || lower.includes('high')) return 'high';
                    else if (c.includes('最低') || lower.includes('low')) return 'low';
                    else if (c.includes('收盘') || lower.includes('close')) return 'close';
                    else if (c.includes('成交量') || lower.includes('volume')) return 'volume';
                    else if (c.includes('BBI.BBI')) return 'BBI';
                    else if (c.includes('MA.MA1')) return 'ma5';
                    else if (c.includes('MA.MA2')) return 'ma10';
                    else if (c.includes('MA.MA3')) return 'ma20';
                    else if (c.includes('MA.MA4')) return 'ma60';
                    else if (c.includes('MA.MA5')) return 'ma90';
                    else if (c.includes('MA.MA6')) return 'ma6';
                    else if (c.includes('MA.MA7')) return 'ma7';
                    else if (c.includes('MA.MA8')) return 'ma8';
                    else if (c.includes('BOLL.BOLL')) return 'boll';
                    else if (c.includes('BOLL.UB')) return 'boll_ub';
                    else if (c.includes('BOLL.LB')) return 'boll_lb';
                    else if (c.includes('OBV.OBV')) return 'obv';
                    else if (c.includes('OBV.MAOBV')) return 'obv_ma';
                    else if (c.includes('MCST.MCST')) return 'mcst';
                    else if (c.includes('MACD.DIF')) return 'dif';
                    else if (c.includes('MACD.DEA')) return 'dea';
                    else if (c.includes('MACD.MACD')) return 'macd';
                    else if (c.includes('ROC.MAROC')) return 'maroc';
                    else if (c.includes('ROC.ROC')) return 'roc';
                    else if (c.includes('SKDJ.K')) return 'SKDJK';
                    else if (c.includes('SKDJ.D')) return 'SKDJD';
                    else if (c.includes('KDJ.K')) return 'K';
                    else if (c.includes('KDJ.D')) return 'D';
                    else if (c.includes('KDJ.J')) return 'J';
                    else if (c.includes('EMV.EMV')) return 'EMV';
                    else if (c.includes('EMV.MAEMV')) return 'MAEMV';
                    else if (c.includes('CCI.CCI')) return 'CCI';
                    else return c; // 保留原列名
                });
            }

            // 转 float 或 NaN
            function toFloatOrNaN(val) {
                if (val === null || val === undefined) return NaN;
                let str = String(val).replace(/\s+/g, '').replace(/\t/g, '');
                if (str === '' || str === 'NaN' || str === 'nan') return NaN;
                const num = Number(str);
                return isNaN(num) ? NaN : num;
            }

            // 主处理逻辑
            function processFileContent(rawText, filename) {
                // 1. 按行拆分，跳过前两行元数据
                const rawLines = rawText.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
                // 去除末尾空行
                while (rawLines.length && rawLines[rawLines.length - 1].trim() === '') rawLines.pop();
                if (rawLines.length <= 2) {
                    throw new Error('文件内容不足：至少需要3行（包括元数据和数据）');
                }
                const dataLines = rawLines.slice(2); // 跳过前两行元数据

                // 2. 解析剩余的 TSV
                const parsedRows = parseTSV(dataLines.join('\n'));
                if (parsedRows.length === 0) throw new Error('无有效数据行');

                // 第一行作为列名
                let columns = parsedRows[0].map(c => (c || '').trim());
                let dataRows = parsedRows.slice(1); // 数据行

                // 3. 删除前两行数据 (原逻辑: df.iloc[2:])
                if (dataRows.length < 2) {
                    throw new Error('数据行不足两行，无法执行删除前两行操作');
                }
                dataRows = dataRows.slice(2);

                // 4. 删除最后一行数据
                if (dataRows.length >= 1) {
                    dataRows = dataRows.slice(0, -1);
                } else {
                    throw new Error('数据为空，无法删除最后一行');
                }

                // 5. 重命名列
                const renamedColumns = renameColumns(columns);

                // 6. 查找 date 列
                let dateIndex = renamedColumns.findIndex(c => c === 'date');
                if (dateIndex === -1) {
                    if (renamedColumns.length > 0) {
                        renamedColumns[0] = 'date';
                        dateIndex = 0;
                    } else {
                        throw new Error('无列名，无法处理');
                    }
                }

                // 7. 处理每一行
                const finalRows = dataRows.map(row => {
                    const newRow = [];
                    for (let i = 0; i < renamedColumns.length; i++) {
                        newRow.push(row[i] !== undefined ? row[i] : '');
                    }
                    // 日期列清理
                    if (dateIndex >= 0 && dateIndex < newRow.length) {
                        let dateVal = newRow[dateIndex];
                        if (dateVal) {
                            dateVal = String(dateVal).replace(/\s+/g, '').replace(/\t/g, '');
                        }
                        newRow[dateIndex] = dateVal || '';
                    }
                    // 其他列转 float
                    for (let i = 0; i < newRow.length; i++) {
                        if (i === dateIndex) continue;
                        const original = newRow[i];
                        const num = toFloatOrNaN(original);
                        newRow[i] = isNaN(num) ? '' : num;
                    }
                    return newRow;
                });

                return { columns: renamedColumns, rows: finalRows, dateIndex };
            }

            // 更新预览
            function updatePreview(columns, rows) {
                if (!columns.length) return;
                previewCard.style.display = 'block';
                shapeBadge.textContent = `${rows.length} 行 × ${columns.length} 列`;
                columnsSummary.textContent = '列: ' + columns.join(', ');

                const headerRow = document.createElement('tr');
                columns.forEach(col => {
                    const th = document.createElement('th');
                    th.textContent = col;
                    headerRow.appendChild(th);
                });
                tableHead.innerHTML = '';
                tableHead.appendChild(headerRow);

                const maxPreview = 30;
                const previewRows = rows.slice(0, maxPreview);
                tableBody.innerHTML = '';
                previewRows.forEach(row => {
                    const tr = document.createElement('tr');
                    for (let i = 0; i < columns.length; i++) {
                        const td = document.createElement('td');
                        let val = row[i] !== undefined ? row[i] : '';
                        if (typeof val === 'number' && isNaN(val)) val = '';
                        td.textContent = val;
                        tr.appendChild(td);
                    }
                    tableBody.appendChild(tr);
                });

                const numericCols = columns.filter((c, idx) => idx !== 0);
                dtypeNote.textContent = `列类型: date 为字符串, ${numericCols.length} 个数值列已转为 float64 (预览中空白表示 NaN)`;
            }

            // 生成 CSV 并下载 (原生实现)
            function downloadCSV() {
                if (!processedData || !processedColumns.length) return;
                const { columns, rows } = processedData;

                // 转义 CSV 字段：如果包含引号、逗号、换行，用双引号包裹，内部双引号转义为两个双引号
                function csvEscape(field) {
                    const str = String(field === undefined || field === null ? '' : field);
                    if (/[",\n\r]/.test(str)) {
                        return '"' + str.replace(/"/g, '""') + '"';
                    }
                    return str;
                }

                const csvLines = [];
                // 表头
                csvLines.push(columns.map(csvEscape).join(','));
                // 数据行
                for (const row of rows) {
                    const fields = [];
                    for (let i = 0; i < columns.length; i++) {
                        fields.push(csvEscape(row[i] !== undefined ? row[i] : ''));
                    }
                    csvLines.push(fields.join(','));
                }

                const csvString = csvLines.join('\r\n');
                // 添加 BOM 让 Excel 识别 UTF-8
                const blob = new Blob(['\uFEFF' + csvString], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                const url = URL.createObjectURL(blob);
                link.href = url;
                let baseName = currentFileName.replace(/\.(xls|xlsx)$/i, '');
                link.download = baseName + '.csv';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            }

            // 状态设置
            function setStatus(msg, type = 'info') {
                statusDiv.textContent = msg;
                statusDiv.className = 'status ' + (type === 'error' ? 'error' : type === 'success' ? 'success' : '');
            }

            function clearPreview() {
                previewCard.style.display = 'none';
                tableHead.innerHTML = '';
                tableBody.innerHTML = '';
                shapeBadge.textContent = '0 行 × 0 列';
                columnsSummary.textContent = '列: —';
                dtypeNote.textContent = '';
            }

            function resetState() {
                currentRawText = null;
                processedData = null;
                processedColumns = [];
                processedRows = [];
                downloadBtn.disabled = true;
                clearPreview();
            }

            // ---------- 事件绑定 ----------
            fileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) {
                    fileNameDisplay.textContent = '尚未选择文件';
                    processBtn.disabled = true;
                    resetState();
                    return;
                }
                fileNameDisplay.textContent = file.name;
                currentFileName = file.name;

                const reader = new FileReader();
                reader.onload = (ev) => {
                    const buffer = ev.target.result;
                    // 尝试 GBK 解码（金融软件常导出 GBK）
                    try {
                        const decoder = new TextDecoder('gbk');
                        currentRawText = decoder.decode(buffer);
                    } catch (err) {
                        const utf8Decoder = new TextDecoder('utf-8');
                        currentRawText = utf8Decoder.decode(buffer);
                    }
                    processBtn.disabled = false;
                    setStatus('文件已加载，点击「处理并预览」执行清洗。', 'info');
                    clearPreview();
                    downloadBtn.disabled = true;
                    processedData = null;
                };
                reader.onerror = () => {
                    setStatus('读取文件失败，请重试。', 'error');
                    processBtn.disabled = true;
                };
                // 注意：这里读 ArrayBuffer
                reader.readAsArrayBuffer(file);
            });

            processBtn.addEventListener('click', function() {
                if (!currentRawText) {
                    setStatus('请先上传文件', 'error');
                    return;
                }
                try {
                    setStatus('处理中... 正在按脚本逻辑清洗数据', 'info');
                    const result = processFileContent(currentRawText, currentFileName);
                    const { columns, rows } = result;

                    processedColumns = columns;
                    processedRows = rows;
                    processedData = { columns, rows };

                    updatePreview(columns, rows);
                    downloadBtn.disabled = false;
                    setStatus(`✅ 处理完成！共 ${rows.length} 行数据, ${columns.length} 列。可下载 CSV。`, 'success');
                } catch (err) {
                    console.error(err);
                    setStatus('❌ 处理出错: ' + err.message, 'error');
                    downloadBtn.disabled = true;
                    clearPreview();
                }
            });

            downloadBtn.addEventListener('click', function() {
                if (!processedData) return;
                try {
                    downloadCSV();
                    setStatus('📥 开始下载 CSV 文件', 'success');
                } catch (err) {
                    setStatus('下载失败: ' + err.message, 'error');
                }
            });

            // 初始化
            resetState();
        })();
    </script>
</body>
</html>

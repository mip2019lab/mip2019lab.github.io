<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 智能图像识别 · 云端版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #0f0c29, #302b63, #24243e);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 32px;
            padding: 36px 40px 40px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .header-left .logo {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }
        .header-left h1 {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
        }
        .header-left h1 span {
            color: #a78bfa;
        }
        .header-left .sub {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 2px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 18px 6px 14px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .status-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse-dot 1.8s ease-in-out infinite;
        }
        .status-badge .dot.loading {
            background: #facc15;
            animation: pulse-dot 0.6s ease-in-out infinite;
        }
        .status-badge .dot.error {
            background: #f87171;
            animation: none;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }
        .btn {
            padding: 8px 22px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.35);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(102, 126, 234, 0.5);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.16);
        }
        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.3);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            margin-bottom: 24px;
        }
        .image-panel {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .image-panel .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .image-panel .panel-header .title {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .image-panel .panel-header .title .tag {
            font-size: 11px;
            font-weight: 400;
            padding: 1px 14px;
            border-radius: 20px;
            background: rgba(102, 126, 234, 0.25);
            color: #a78bfa;
        }
        .canvas-container {
            position: relative;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 14px;
            overflow: hidden;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .canvas-container canvas {
            width: 100%;
            height: auto;
            max-height: 420px;
            object-fit: contain;
            display: block;
        }
        .canvas-container .placeholder {
            position: absolute;
            color: rgba(255, 255, 255, 0.2);
            font-size: 15px;
            pointer-events: none;
            text-align: center;
            line-height: 1.6;
        }
        .canvas-container .placeholder .icon {
            font-size: 42px;
            display: block;
            margin-bottom: 8px;
        }
        .upload-zone {
            margin-top: 16px;
            border: 2px dashed rgba(255, 255, 255, 0.10);
            border-radius: 14px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            transition: all 0.3s;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.02);
        }
        .upload-zone:hover {
            border-color: rgba(102, 126, 234, 0.4);
            background: rgba(255, 255, 255, 0.04);
        }
        .upload-zone.dragover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.08);
        }
        .upload-zone .left {
            display: flex;
            align-items: center;
            gap: 14px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }
        .upload-zone .left .icon {
            font-size: 28px;
        }
        .upload-zone input[type="file"] {
            display: none;
        }
        .upload-zone .file-name {
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .result-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .result-panel .panel-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 20px 22px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            flex: 1;
        }
        .result-panel .panel-card .card-title {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 14px;
        }
        .result-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .result-item:last-child {
            border-bottom: none;
        }
        .result-item .rank {
            font-size: 12px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.2);
            min-width: 24px;
        }
        .result-item .label {
            flex: 1;
            color: rgba(255, 255, 255, 0.85);
            font-size: 14px;
            font-weight: 500;
        }
        .result-item .prob {
            font-size: 13px;
            font-weight: 600;
            color: #a78bfa;
            min-width: 52px;
            text-align: right;
        }
        .result-item .bar {
            width: 80px;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            overflow: hidden;
        }
        .result-item .bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #a78bfa);
            border-radius: 4px;
            transition: width 0.6s ease;
        }
        .result-empty {
            color: rgba(255, 255, 255, 0.2);
            font-size: 14px;
            text-align: center;
            padding: 30px 0;
            line-height: 1.8;
        }
        .history-list {
            max-height: 110px;
            overflow-y: auto;
        }
        .history-list::-webkit-scrollbar {
            width: 3px;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        .history-item .h-label {
            color: rgba(255, 255, 255, 0.6);
        }
        .history-item .h-time {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
        }
        .footer-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .footer-actions .spacer {
            flex: 1;
        }
        .footer-actions .privacy-note {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.12);
        }

        @media (max-width: 820px) {
            .container {
                padding: 20px;
            }
            .main-grid {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 14px;
            }
            .header-right {
                width: 100%;
                justify-content: flex-start;
            }
        }
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .container {
                padding: 16px;
                border-radius: 20px;
            }
            .header-left h1 {
                font-size: 19px;
            }
            .upload-zone {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .upload-zone .left {
                justify-content: center;
            }
        }
        .flex-wrap {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <div class="header-left">
                <div class="logo">🧠</div>
                <div>
                    <h1>AI 智能<span>图像识别</span></h1>
                    <div class="sub">基于 Qwen-VL · 云端多模态-2024416914-房**同学</div>
                </div>
            </div>
            <div class="header-right">
                <div class="status-badge" id="statusBadge">
                    <span class="dot" id="statusDot"></span>
                    <span id="statusText">就绪</span>
                </div>
                <button class="btn btn-secondary" id="btnClearHistory">🗑️ 清空历史</button>
            </div>
        </div>

        <!-- 主区域 -->
        <div class="main-grid">
            <!-- 左侧：图片 -->
            <div class="image-panel">
                <div class="panel-header">
                    <div class="title">🖼️ 图像预览 <span class="tag">原始</span></div>
                    <span style="font-size:12px; color:rgba(255,255,255,0.2);" id="imgSizeText">尺寸: -</span>
                </div>
                <div class="canvas-container" id="canvasContainer">
                    <canvas id="imageCanvas"></canvas>
                    <div class="placeholder" id="placeholder">
                        <span class="icon">📤</span>
                        上传图片即可自动识别<br />
                        <span style="font-size:13px; opacity:0.6;">支持 JPG / PNG</span>
                    </div>
                </div>
                <div class="upload-zone" id="uploadZone">
                    <div class="left">
                        <span class="icon">📂</span>
                        <span>点击上传 / 拖拽图片</span>
                        <span class="file-name" id="fileName">未选择文件</span>
                    </div>
                    <div class="flex-wrap" style="gap:8px;">
                        <input type="file" id="fileInput" accept="image/*" />
                        <button class="btn btn-primary" id="btnUpload" style="font-size:12px; padding:6px 20px;">📁 选择图片</button>
                    </div>
                </div>
            </div>

            <!-- 右侧：结果 -->
            <div class="result-panel">
                <div class="panel-card" style="flex:2;">
                    <div class="card-title">🏷️ 识别结果</div>
                    <div id="resultContainer">
                        <div class="result-empty">
                            <span style="font-size:32px; display:block; margin-bottom:8px;">🔍</span>
                            上传图片后，AI 将自动识别<br />并生成图片描述
                        </div>
                    </div>
                </div>
                <div class="panel-card" style="flex:1;">
                    <div class="card-title">📋 识别历史</div>
                    <div class="history-list" id="historyList">
                        <div style="color:rgba(255,255,255,0.15); font-size:13px; text-align:center; padding:14px 0;">暂无记录</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部 -->
        <div class="footer-actions">
            <button class="btn btn-secondary" id="btnReset">↺ 重置画布</button>
            <button class="btn btn-primary" id="btnExportReport">📊 导出识别报告</button>
            <span class="spacer"></span>
            <span class="privacy-note"></span>
        </div>
    </div>

    <script>
        // ============================================================
        //  配置：你的 API Key
        // ============================================================
        const API_KEY = 'sk-ws-H.PMLLMHH.YTIW.MEUCIBrxbEeGYm5yMV1HkgotMQaD_EWmx6Q1q0NXl-P5Y4tpAiEAs13d3003o9cwNGQNtKh7cTgPP0MGfJ0dhTmLD5X6DLw';

        // ============================================================
        //  核心逻辑
        // ============================================================
        const canvas = document.getElementById('imageCanvas');
        const ctx = canvas.getContext('2d');
        const canvasContainer = document.getElementById('canvasContainer');
        const placeholder = document.getElementById('placeholder');
        const fileInput = document.getElementById('fileInput');
        const uploadZone = document.getElementById('uploadZone');
        const btnUpload = document.getElementById('btnUpload');
        const btnReset = document.getElementById('btnReset');
        const btnClearHistory = document.getElementById('btnClearHistory');
        const btnExportReport = document.getElementById('btnExportReport');
        const fileName = document.getElementById('fileName');
        const imgSizeText = document.getElementById('imgSizeText');
        const resultContainer = document.getElementById('resultContainer');
        const historyList = document.getElementById('historyList');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');

        let history = [];
        let isProcessing = false;

        // ---- 状态 ----
        function setStatus(text, type) {
            statusText.textContent = text;
            statusDot.className = 'dot';
            if (type === 'loading') statusDot.classList.add('loading');
            else if (type === 'error') statusDot.classList.add('error');
        }

        // ---- 绘制图片到 Canvas ----
        function drawImageToCanvas(img) {
            const maxW = canvasContainer.clientWidth - 8;
            const maxH = 420;
            let w = img.width,
                h = img.height;
            const ratio = Math.min(maxW / w, maxH / h, 1);
            w = Math.round(w * ratio);
            h = Math.round(h * ratio);
            canvas.width = w;
            canvas.height = h;
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
            ctx.clearRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            placeholder.style.display = 'none';
            imgSizeText.textContent = `尺寸: ${img.width}×${img.height} → ${w}×${h}`;
        }

        // ---- 图片转 Base64（不含前缀）----
        function imageToBase64(img) {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = img.width;
            tempCanvas.height = img.height;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(img, 0, 0);
            return tempCanvas.toDataURL('image/jpeg');
        }

        // ---- 调用阿里云百炼 Qwen-VL API ----
        async function recognizeWithQwen(img) {
            const base64Data = imageToBase64(img);

            setStatus('AI 识别中...', 'loading');

            try {
                const response = await fetch('https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'qwen-vl-max',
                        messages: [{
                            role: 'user',
                            content: [{
                                type: 'text',
                                text: '请用中文简洁地描述这张图片中的主要内容，直接说图片里有什么，不要加无关的客套话。'
                            }, {
                                type: 'image_url',
                                image_url: {
                                    url: base64Data
                                }
                            }]
                        }],
                        stream: false
                    })
                });

                const data = await response.json();

                if (data.error) {
                    setStatus('识别失败', 'error');
                    return '❌ API 错误：' + (data.error.message || '未知错误');
                }

                const result = data.choices?.[0]?.message?.content || '未能获取识别结果';
                setStatus('识别完成', 'ready');
                return result;

            } catch (e) {
                setStatus('网络错误', 'error');
                return '❌ 请求失败：' + e.message;
            }
        }

        // ---- 显示结果 ----
        function displayResult(text) {
            resultContainer.innerHTML = `
                <div class="result-item" style="border-bottom:none; padding:12px 0; flex-wrap:wrap;">
                    <span style="color:rgba(255,255,255,0.85); font-size:15px; line-height:1.8; width:100%;">
                        📝 ${text}
                    </span>
                </div>
            `;
        }

        // ---- 历史记录 ----
        function addHistory(label) {
            const time = new Date().toLocaleTimeString();
            history.unshift({ label, time });
            if (history.length > 20) history.pop();
            renderHistory();
        }

        function renderHistory() {
            if (history.length === 0) {
                historyList.innerHTML =
                    `<div style="color:rgba(255,255,255,0.15); font-size:13px; text-align:center; padding:14px 0;">暂无记录</div>`;
                return;
            }
            let html = '';
            history.forEach((item) => {
                html += `
                    <div class="history-item">
                        <span class="h-label">${item.label}</span>
                        <span class="h-time">${item.time}</span>
                    </div>
                `;
            });
            historyList.innerHTML = html;
        }

        // ---- 主流程：上传 -> 绘制 -> 识别 ----
        async function handleFile(file) {
            if (!file) return;
            fileName.textContent = file.name;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = async function() {
                    drawImageToCanvas(img);
                    // 开始识别
                    const result = await recognizeWithQwen(img);
                    displayResult(result);
                    addHistory(result.substring(0, 30) + (result.length > 30 ? '...' : ''));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // ---- 重置 ----
        function resetCanvas() {
            canvas.width = 0;
            canvas.height = 0;
            canvas.style.width = '100%';
            canvas.style.height = 'auto';
            placeholder.style.display = 'block';
            imgSizeText.textContent = '尺寸: -';
            fileName.textContent = '未选择文件';
            resultContainer.innerHTML = `
                <div class="result-empty">
                    <span style="font-size:32px; display:block; margin-bottom:8px;">🔍</span>
                    上传图片后，AI 将自动识别<br />并生成图片描述
                </div>
            `;
            setStatus('就绪', 'ready');
        }

        // ---- 导出报告 ----
        function exportReport() {
            if (history.length === 0) {
                alert('暂无识别记录，请先上传图片进行识别。');
                return;
            }
            let text = '===== AI 图像识别报告 =====\n';
            text += '生成时间: ' + new Date().toLocaleString() + '\n';
            text += '识别次数: ' + history.length + '\n\n--- 识别记录 ---\n';
            history.forEach((item, i) => {
                text += `${i+1}. ${item.label}  ${item.time}\n`;
            });
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '识别报告_' + new Date().toISOString().slice(0, 10) + '.txt';
            a.click();
            URL.revokeObjectURL(url);
        }

        // ---- 事件绑定 ----
        btnUpload.addEventListener('click', () => fileInput.click());
        uploadZone.addEventListener('click', (e) => {
            if (e.target.closest('button') || e.target.closest('input')) return;
            fileInput.click();
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
            fileInput.value = '';
        });
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });
        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });
        btnReset.addEventListener('click', resetCanvas);
        btnClearHistory.addEventListener('click', () => {
            if (confirm('确定要清空所有识别历史吗？')) { history = [];
                renderHistory(); }
        });
        btnExportReport.addEventListener('click', exportReport);

        // ---- 键盘快捷键 ----
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') resetCanvas();
        });

        console.log('🧠 AI 图像识别系统已启动 (Qwen-VL 云端版)');
        console.log('📌 API Key 已配置');
    </script>
</body>
</html>
